#!/usr/sbin/nft -f
# Default-deny egress for a device that connects to the Pauhu API.
# No inbound. Outbound only to the Pauhu endpoints (TCP 443), a TRUSTED resolver and a
# TRUSTED time source. This TEMPLATE governs IPv4 and IPv6 in one inet table.
#
# `flush ruleset` below replaces ALL existing rules so no earlier ACCEPT survives.
#
# Every SERVICE allow rule (DNS, NTP, the Pauhu endpoints on 443) is bound to a named address
# set, and the sets ship EMPTY. So on an unpopulated ruleset no TCP/UDP egress to any service
# destination is permitted (fail-closed): no service traffic leaves until you add the addresses.
# This is NOT "every outgoing packet is dropped": loopback, established/related return traffic,
# and the REQUIRED link-local ICMPv6 control types listed below (and the removable echo) stay
# allowed by design and do not depend on the sets -- that is the network control plane IPv6 needs,
# not egress to a service. Fill each set with the current resolved addresses of PAUHU_API_FQDN /
# PAUHU_AUTH_FQDN and of your chosen DNS and NTP servers (refresh from a trusted resolver, or
# enforce the hostname at an egress proxy), then verify with `nft list ruleset`. Keep both the v4
# and v6 set of each kind so IPv6 is not left open.
#
# IPv6 note (RFC 4890 4.4 / 4.4.1): a strict DROP that also blocks ICMPv6 would break IPv6,
# because Neighbor/Router Discovery and the ICMPv6 error messages are required for IPv6 to
# function (established,related does not cover the initial ND a device emits or receives). The
# rules below permit only that REQUIRED control traffic, scoped and ROLE/DIRECTION specific for a
# CLIENT host: it SENDS Router Solicitations and RECEIVES Router Advertisements, never the
# reverse (a client must not advertise itself as a router); Neighbor Solicitation/Advertisement
# both ways; all with the RFC 4861 on-link hop-limit-255 guarantee. ICMPv6 errors are scoped to
# the must-not-drop codes, and MLD is kept link-local by hop limit 1 (NOT by a destination prefix:
# an MLDv1 report is sent to the group address, whose scope may exceed ff02::/16). This is control
# traffic, not egress to a service: the Internet egress allow-list is still gated by the empty
# address sets (fail-closed).
#
# Match predicate: every ICMPv6 rule uses `meta l4proto ipv6-icmp`, NOT `ip6 nexthdr icmpv6`.
# `nexthdr` tests only the IPv6 header's immediate next-header value, so a packet carrying an
# extension header would not match; MLD query/report carry a Hop-by-Hop Router Alert option, so a
# `nexthdr` match would silently drop them. `meta l4proto` resolves the upper-layer protocol across
# extension headers, so the MLD rules (hop limit 1) match the Hop-by-Hop-wrapped MLD packets too.
#
# Address assignment: this template covers IPv6 addressing by SLAAC or static configuration. It does
# NOT add DHCPv6: a device that obtains its address by DHCPv6 (managed flag) also needs UDP from
# source port 546 to the server/relay on 547 -- add a reviewed output rule for that if your network
# uses DHCPv6. It also does NOT configure SEND (148,149), inverse ND (141,142) or multicast-router
# discovery (151-153) -- add those rules if your device uses them.

flush ruleset

table inet pauhu_egress {
    set pauhu_v4 { type ipv4_addr; flags interval; }
    set pauhu_v6 { type ipv6_addr; flags interval; }
    set dns_v4   { type ipv4_addr; }
    set dns_v6   { type ipv6_addr; }
    set ntp_v4   { type ipv4_addr; }
    set ntp_v6   { type ipv6_addr; }

    chain input {
        type filter hook input priority 0; policy drop;
        iif "lo" accept
        ct state established,related accept
        # Required link-local ICMPv6 a CLIENT host RECEIVES (RFC 4890 4.4/4.4.1). A client accepts
        # Router Advertisements (134), Neighbor Solicitation (135) and Advertisement (136); it does
        # NOT accept Router Solicitations (133 -- only routers consume them). hop limit 255 = the
        # RFC 4861 on-link guarantee (off-link spoofs are discarded).
        meta l4proto ipv6-icmp icmpv6 type { 134, 135, 136 } ip6 hoplimit 255 accept
        # Echo reply to our own connectivity checks (remove this line if policy forbids ping).
        meta l4proto ipv6-icmp icmpv6 type 129 accept
        # ICMPv6 errors that must not be dropped (RFC 4890 4.4.1): dest-unreachable (1, all codes),
        # packet-too-big (2, PMTUD), time-exceeded code 0 (3), parameter-problem codes 1 and 2 (4).
        meta l4proto ipv6-icmp icmpv6 type { 1, 2 } accept
        meta l4proto ipv6-icmp icmpv6 type 3 icmpv6 code 0 accept
        meta l4proto ipv6-icmp icmpv6 type 4 icmpv6 code { 1, 2 } accept
        # MLD Query from the on-link router: link-local by hop limit 1, not by destination prefix.
        meta l4proto ipv6-icmp icmpv6 type 130 ip6 hoplimit 1 accept
        # no inbound services are exposed
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy drop;
        oif "lo" accept
        ct state established,related accept

        # Required link-local ICMPv6 a CLIENT host SENDS (RFC 4890 4.4/4.4.1). A client sends
        # Router Solicitations (133), Neighbor Solicitation (135) and Advertisement (136); it does
        # NOT send Router Advertisements (134 -- a client must never advertise itself as a router).
        # hop limit 255 = the RFC 4861 on-link guarantee.
        meta l4proto ipv6-icmp icmpv6 type { 133, 135, 136 } ip6 hoplimit 255 accept
        # Echo request for our own connectivity checks (remove this line if policy forbids ping).
        meta l4proto ipv6-icmp icmpv6 type 128 accept
        # ICMPv6 errors a host may emit (RFC 4890 4.4.1): dest-unreachable (1), packet-too-big (2),
        # time-exceeded code 0 (3), parameter-problem codes 1 and 2 (4).
        meta l4proto ipv6-icmp icmpv6 type { 1, 2 } accept
        meta l4proto ipv6-icmp icmpv6 type 3 icmpv6 code 0 accept
        meta l4proto ipv6-icmp icmpv6 type 4 icmpv6 code { 1, 2 } accept
        # MLD membership reports / done, link-local by hop limit 1 (not by destination prefix).
        meta l4proto ipv6-icmp icmpv6 type { 131, 132, 143 } ip6 hoplimit 1 accept

        # DNS and NTP only to the trusted servers in the sets (empty set => no match => drop)
        ip  daddr @dns_v4 udp dport 53  accept
        ip  daddr @dns_v4 tcp dport 53  accept
        ip6 daddr @dns_v6 udp dport 53  accept
        ip6 daddr @dns_v6 tcp dport 53  accept
        ip  daddr @ntp_v4 udp dport 123 accept
        ip6 daddr @ntp_v6 udp dport 123 accept

        # Pauhu API + sign-in over TLS only
        ip  daddr @pauhu_v4 tcp dport 443 accept
        ip6 daddr @pauhu_v6 tcp dport 443 accept

        # everything else is denied by policy; log for monitoring
        log prefix "pauhu-egress-drop: " counter drop
    }
}
